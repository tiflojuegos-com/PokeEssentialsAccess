name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: syntax
        run: |
          for f in $(find core games loader test -name '*.rb'); do ruby -c "$f" >/dev/null || exit 1; done
      - name: tests
        run: ruby test/run_all.rb
      # Every profile on disk, never a hand-written list: the previous one had drifted and silently stopped
      # covering three profiles (awakening and both Infinite Fusion) even though they were shipping. Deriving
      # it means a new profile is smoke-loaded from the moment its folder exists.
      - name: profiles
        run: |
          for d in games/*/; do
            p=$(basename "$d")
            [ -f "$d/manifest.rb" ] || continue
            echo "-- $p"
            ruby -e "require './test/support/harness'; e = Harness.load_all('$p'); abort('FAIL '+ARGV[0]+': '+e.inspect) unless e.empty?" "$p" || exit 1
          done
