name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      # Every Ruby file parsed; with no 1.8.7 interpreter on the runner, the only parse plugins/ gets here.
      - name: syntax
        run: |
          for f in $(find core games plugins loader test -name '*.rb'); do ruby -c "$f" >/dev/null || exit 1; done
      # The marker grep fails a run that skipped the static checks (a filtered invocation).
      - name: tests
        run: |
          set -o pipefail
          ruby test/run_all.rb 2>&1 | tee /tmp/suite.log
          grep -q "=== static checks ===" /tmp/suite.log || { echo "::error::static checks did not run (filtered invocation?)"; exit 1; }
      # Every games/*/manifest.rb on disk loaded in isolation; the count run must equal the count found.
      - name: profiles
        run: |
          want=$(ls games/*/manifest.rb | wc -l)
          got=0
          for d in games/*/; do
            p=$(basename "$d")
            [ -f "$d/manifest.rb" ] || continue
            echo "-- $p"
            ruby -e "require './test/support/harness'; e = Harness.load_all('$p'); abort('FAIL '+ARGV[0]+': '+e.inspect) unless e.empty?" "$p" || exit 1
            got=$((got+1))
          done
          [ "$got" -eq "$want" ] || { echo "::error::profiles smoke ran $got of $want"; exit 1; }
      # The launcher version.json names must already be released in its repository, where the release takes it from.
      - name: launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(ruby -rjson -e 'print JSON.parse(File.read("version.json"))["launcher"].to_s')
          gh release view "v$v" -R tiflojuegos-com/PokeEssentialsAccessInstaller --json assets --jq '.assets[].name' \
            | grep -qx pokeessentialsaccess-launcher.exe || { echo "::error::launcher v$v has no release with its exe"; exit 1; }
