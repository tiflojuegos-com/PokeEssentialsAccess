name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      # plugins/ entra en el barrido: el runner no lleva interprete 1.8.7, asi que check187_real se queda en
      # PARCIAL y este paso es lo unico que llega a parsear esos ficheros.
      - name: syntax
        run: |
          for f in $(find core games plugins loader test -name '*.rb'); do ruby -c "$f" >/dev/null || exit 1; done
      # The marker grep is the floor: a filtered invocation left behind after debugging would skip every
      # static check while still printing "0 fail", and nothing else distinguishes the two passes.
      - name: tests
        run: |
          set -o pipefail
          ruby test/run_all.rb 2>&1 | tee /tmp/suite.log
          grep -q "=== static checks ===" /tmp/suite.log || { echo "::error::static checks did not run (filtered invocation?)"; exit 1; }
      # Every profile on disk, never a hand-written list: the previous one had drifted and silently stopped
      # covering three profiles (awakening and both Infinite Fusion) even though they were shipping. Deriving
      # it means a new profile is smoke-loaded from the moment its folder exists. The executed count is
      # compared against the manifests on disk, so a filter slipped into the loop cannot shrink it quietly.
      - name: profiles
        run: |
          want=$(ls games/*/manifest.rb | wc -l)
          got=0
          for d in games/*/; do
            p=$(basename "$d")
            [ -f "$d/manifest.rb" ] || continue
            echo "-- $p"
            ruby -e "require './test/support/harness'; e = Harness.load_all('$p'); abort('FAIL '+ARGV[0]+': '+e.inspect) unless e.empty?" "$p" || exit 1
            got=$((got+1))
          done
          [ "$got" -eq "$want" ] || { echo "::error::profiles smoke ran $got of $want"; exit 1; }
