name: launcher

on:
  workflow_call:
    inputs:
      create_artifact:
        description: 'Whether to upload the compiled launcher as a workflow artifact'
        required: false
        type: boolean
        default: false
    outputs:
      artifact_name:
        description: 'Name of the generated launcher artifact'
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Verify GNU build tools
        shell: bash
        run: |
          set -euo pipefail
          gcc --version
          g++ --version
          cmake --version

      - name: Test launcher
        working-directory: launcher
        run: cargo test --locked --release --target x86_64-pc-windows-gnu --no-run --verbose

      - name: Build launcher
        working-directory: launcher
        run: cargo build --locked --release --target x86_64-pc-windows-gnu --verbose

      - name: Inspect native libraries
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          if [ -d "launcher/target" ]; then
            find launcher/target -type f \
              \( -name '*.a' -o -name '*.dll' -o -name '*.lib' \) \
              | sort
          else
            echo "launcher/target does not exist"
          fi

      - name: Prepare launcher artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          src="launcher/target/x86_64-pc-windows-gnu/release/pokeessentialsaccess-launcher.exe"
          dst="pokeessentialsaccess-launcher.exe"
          [ -f "$src" ] || { echo "::error::missing launcher binary: $src"; exit 1; }
          cp "$src" "$dst"
          echo "artifact_name=$dst" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$dst" >> "$GITHUB_ENV"


      - name: Upload launcher artifact
        if: ${{ inputs.create_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: "pokeessentialsaccess-launcher"
          path: pokeessentialsaccess-launcher.exe
          if-no-files-found: error
