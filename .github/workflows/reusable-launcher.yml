name: launcher

on:
  workflow_call:
    inputs:
      create_artifact:
        description: 'Whether to upload the compiled launcher as a workflow artifact'
        required: false
        type: boolean
        default: false
    outputs:
      artifact_name:
        description: 'Name of the generated launcher artifact'
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Install Windows cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Test launcher
        working-directory: launcher
        run: cargo test --locked --release --target x86_64-pc-windows-gnu --no-run

      - name: Build launcher
        working-directory: launcher
        run: cargo build --locked --release --target x86_64-pc-windows-gnu

      - name: Prepare launcher artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          src="launcher/target/x86_64-pc-windows-gnu/release/pokeessentialsaccess-launcher.exe"
          dst="pokeessentialsaccess-launcher.exe"
          [ -f "$src" ] || { echo "::error::missing launcher binary: $src"; exit 1; }
          cp "$src" "$dst"
          echo "artifact_name=$dst" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$dst" >> "$GITHUB_ENV"


      - name: Upload launcher artifact
        if: ${{ inputs.create_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: "pokeessentialsaccess-launcher"
          path: ${{ env.artifact_name || "pokeessentialsaccess-launcher.exe" }}
          if-no-files-found: error
