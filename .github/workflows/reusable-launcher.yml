name: launcher

on:
  workflow_call:
    inputs:
      create_artifact:
        description: 'Whether to upload the compiled launcher as a workflow artifact'
        required: false
        type: boolean
        default: false
    outputs:
      artifact_name:
        description: 'Name of the generated launcher artifact'
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install and verify Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
          }
          cl
          cmake --version
          ninja --version

      - name: Test launcher
        working-directory: launcher
        run: cargo test --locked --release --no-run --verbose

      - name: Build launcher
        working-directory: launcher
        run: cargo build --locked --release --verbose

      - name: Inspect native libraries
        if: ${{ always() }}
        shell: pwsh
        run: |
          $target = 'launcher/target'
          if (Test-Path $target) {
            Get-ChildItem -Path $target -Recurse -File |
              Where-Object { $_.Extension -in @('.a', '.dll', '.lib') } |
              Sort-Object FullName |
              Select-Object -ExpandProperty FullName
          } else {
            Write-Host "$target does not exist"
          }

      - name: Prepare launcher artifact
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'launcher/target/release/pokeessentialsaccess-launcher.exe'
          $dst = 'pokeessentialsaccess-launcher.exe'
          if (-not (Test-Path $src -PathType Leaf)) {
            Write-Error "missing launcher binary: $src"
          }
          Copy-Item $src $dst
          "artifact_name=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=$dst" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Upload launcher artifact
        if: ${{ inputs.create_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: "pokeessentialsaccess-launcher"
          path: pokeessentialsaccess-launcher.exe
          if-no-files-found: error
