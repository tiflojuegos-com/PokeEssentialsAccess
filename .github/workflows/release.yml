name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.7)'
        required: true

permissions:
  contents: write

jobs:
  package_mod:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      zip_name: ${{ steps.meta.outputs.zip_name }}
      zip_sha: ${{ steps.meta.outputs.zip_sha }}
      launcher_version: ${{ steps.meta.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          LAUNCHER_VERSION=$(ruby -ne 'print $1 if /^version = "([^"]+)"/ && $~.captures.first' launcher/Cargo.toml)
          ZIP="PokeEssentialsAccess_${TAG}.zip"
          SHAZIP="${ZIP}.sha256"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "LAUNCHER_VERSION=$LAUNCHER_VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_sha=$SHAZIP" >> "$GITHUB_OUTPUT"
          echo "launcher_version=$LAUNCHER_VERSION" >> "$GITHUB_OUTPUT"

      # The same three gates CI runs, on the exact tree about to be packaged: pushing a tag must never publish
      # a build that does not pass its own tests. The syntax sweep is the only parse plugins/ gets on a runner
      # with no 1.8.7 interpreter; the marker grep refuses a filtered pass that skipped the static checks
      # while still printing "0 fail"; the profile smoke loads every games/*/manifest.rb in isolation.
      - name: syntax
        run: |
          for f in $(find core games plugins loader test -name '*.rb'); do ruby -c "$f" >/dev/null || exit 1; done
      - name: tests
        run: |
          set -o pipefail
          ruby test/run_all.rb 2>&1 | tee /tmp/suite.log
          grep -q "=== static checks ===" /tmp/suite.log || { echo "::error::static checks did not run (filtered invocation?)"; exit 1; }
      - name: profiles
        run: |
          want=$(ls games/*/manifest.rb | wc -l)
          got=0
          for d in games/*/; do
            p=$(basename "$d")
            [ -f "$d/manifest.rb" ] || continue
            echo "-- $p"
            ruby -e "require './test/support/harness'; e = Harness.load_all('$p'); abort('FAIL '+ARGV[0]+': '+e.inspect) unless e.empty?" "$p" || exit 1
            got=$((got+1))
          done
          [ "$got" -eq "$want" ] || { echo "::error::profiles smoke ran $got of $want"; exit 1; }

      - name: generate version.json
        shell: bash
        run: |
          set -euo pipefail
          cat > version.json <<JSON
          {
            "version": "${TAG}",
            "min_launcher": "0.2.0",
            "launcher": "${LAUNCHER_VERSION}"
          }
          JSON

      - name: build zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          cp -r assets core lang loader installer version.json stage/
          cp -r games stage/games
          cp -r plugins stage/plugins
          for d in assets core games plugins lang loader installer; do
            [ -d "stage/$d" ] || { echo "::error::stage/$d missing from the zip"; exit 1; }
          done
          [ -f "stage/version.json" ] || { echo "::error::stage/version.json missing from the zip"; exit 1; }
          cp LICENSE stage/
          for f in README.md README.es.md README.en.md; do [ -f "$f" ] && cp "$f" stage/; done
          cp -r docs stage/docs
          (cd stage && zip -rq "../PokeEssentialsAccess_${TAG}.zip" .)
          sha256sum "PokeEssentialsAccess_${TAG}.zip" > "PokeEssentialsAccess_${TAG}.zip.sha256"

      - name: upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeessentialsaccess-mod
          path: |
            version.json
            PokeEssentialsAccess_${{ env.TAG }}.zip
            PokeEssentialsAccess_${{ env.TAG }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  launcher:
    uses: ./.github/workflows/reusable-launcher.yml
    with:
      create_artifact: true
      run_tests: false

  publish_release:
    needs:
      - package_mod
      - launcher
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package_mod.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          MOD_DIR="release-artifacts/pokeessentialsaccess-mod"
          LAUNCHER_DIR="release-artifacts/pokeessentialsaccess-launcher"

          MOD_ZIP=$(find "$MOD_DIR" -name "PokeEssentialsAccess_${TAG}.zip" -type f | head -n 1)
          MOD_SHA=$(find "$MOD_DIR" -name "PokeEssentialsAccess_${TAG}.zip.sha256" -type f | head -n 1)
          MOD_VERSION=$(find "$MOD_DIR" -name "version.json" -type f | head -n 1)
          LAUNCHER_BIN=$(find "$LAUNCHER_DIR" -name 'pokeessentialsaccess-launcher.exe' -type f | head -n 1)

          [ -n "$MOD_ZIP" ] || { echo "::error::mod zip not found"; exit 1; }
          [ -n "$MOD_SHA" ] || { echo "::error::mod sha file not found"; exit 1; }
          [ -n "$MOD_VERSION" ] || { echo "::error::mod version.json not found"; exit 1; }
          [ -n "$LAUNCHER_BIN" ] || { echo "::error::launcher exe not found"; exit 1; }

          ASSETS=("$MOD_ZIP" "$MOD_SHA" "$MOD_VERSION" "$LAUNCHER_BIN")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "${TAG#v}" --notes ""
          fi
